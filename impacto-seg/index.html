<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit · Impacto Seg — Demonstração</title>
<style>
  :root{
    --navy:#14202E; --navy2:#1b2c3d; --teal:#188FA3; --tealD:#12707F;
    --bg:#EEF1F4; --line:#E5E9EE; --text:#1A2230; --muted:#6B7683; --muted2:#9AA7B4;
    --ok:#1f8a5b; --warn:#d08b1f; --err:#d9534f; --blue:#2f6fb0; --purple:#6b4a9e;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:var(--bg);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  a{color:var(--teal);text-decoration:none;}
  .hidden{display:none!important;}
  .muted{color:var(--muted);font-size:13px;}

  /* Demo ribbon */
  .ribbon{background:linear-gradient(90deg,#d08b1f,#e0a53b);color:#3a2a06;font-size:12.5px;
    font-weight:700;text-align:center;padding:5px;letter-spacing:.3px;}
  .ribbon b{color:#2a1f04;}

  /* Header */
  header.top{height:62px;background:var(--navy);color:#fff;display:flex;align-items:center;
    justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:30;}
  .brand{display:flex;align-items:center;gap:11px;}
  .brand .sq{width:38px;height:38px;border-radius:10px;background:var(--teal);display:flex;
    align-items:center;justify-content:center;font-size:19px;color:#fff;font-weight:800;}
  .brand .nm{font-weight:800;font-size:17px;line-height:1;}
  .brand .sb{font-size:10px;letter-spacing:2px;color:var(--muted2);}
  .emp-chip{display:flex;align-items:center;gap:8px;margin-left:10px;padding:5px 12px;border-radius:999px;
    background:rgba(255,255,255,.08);font-size:13px;}
  .emp-chip .lg{width:22px;height:22px;border-radius:6px;background:var(--teal);display:flex;align-items:center;
    justify-content:center;font-weight:700;font-size:11px;}
  .hright{display:flex;align-items:center;gap:14px;}
  .pswitch{display:flex;gap:4px;background:rgba(255,255,255,.07);padding:4px;border-radius:10px;}
  .pswitch button{border:0;background:none;color:#c7d2de;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:7px;}
  .pswitch button.on{background:var(--teal);color:#fff;}
  .bell{position:relative;background:none;border:0;color:#cbd5e1;padding:7px;border-radius:8px;}
  .bell:hover{background:rgba(255,255,255,.08);}
  .badge{position:absolute;top:1px;right:1px;background:var(--err);color:#fff;font-size:10px;font-weight:700;
    min-width:16px;height:16px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
  .upill{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.08);border:0;color:#fff;border-radius:999px;padding:5px 12px 5px 5px;}
  .upill .av{width:30px;height:30px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
  .upill .un{font-size:12.5px;font-weight:600;line-height:1.1;text-align:left;}
  .upill .ur{font-size:10.5px;color:var(--muted2);}

  /* Shell */
  .body{display:flex;min-height:calc(100vh - 62px);}
  aside{width:224px;background:#fff;border-right:1px solid var(--line);flex-shrink:0;display:flex;flex-direction:column;}
  nav{flex:1;padding:12px 0;}
  .grp-h{padding:14px 20px 6px;font-size:10.5px;letter-spacing:1px;color:var(--muted2);font-weight:700;}
  .navi{width:100%;display:flex;align-items:center;gap:12px;padding:10px 20px;border:0;border-left:3px solid transparent;
    background:none;font-size:14px;color:var(--muted);text-align:left;}
  .navi:hover{background:#F6F8FA;color:var(--text);}
  .navi.on{background:#EAF6F8;color:var(--tealD);font-weight:700;border-left-color:var(--teal);}
  .navi .ic{width:20px;text-align:center;font-size:15px;}
  .navi .cnt{margin-left:auto;background:#eef2f6;color:var(--muted);font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px;}
  .navi.smg{color:#b4701a;}
  .navi.smg.on{background:#fbf2e3;color:#8a5610;border-left-color:#d08b1f;}
  .side-bot{border-top:1px solid var(--line);padding:12px 16px;}
  .side-bot .v{font-size:11px;color:var(--muted2);}

  main{flex:1;min-width:0;padding:26px 30px;}
  h1.wel{font-size:27px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:14.5px;margin:0 0 8px;}
  .chip{display:inline-block;background:#EAF6F8;color:var(--tealD);font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:999px;}
  .seclbl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin:22px 0 12px;}
  .dot{width:9px;height:9px;border-radius:3px;background:var(--teal);}
  .pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}

  .tools{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media(max-width:1250px){.tools{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:820px){.tools{grid-template-columns:repeat(2,1fr);}}
  .tcard{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;display:flex;flex-direction:column;gap:9px;text-align:left;}
  .tcard:hover{box-shadow:0 3px 12px rgba(20,32,46,.08);}
  .tcard.lock{opacity:.5;}
  .tsq{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;}
  .tcard .tn{font-weight:700;font-size:15px;}
  .tcard .td{font-size:12.5px;color:var(--muted);line-height:1.35;}
  .locktag{font-size:10px;color:var(--muted2);background:#f1f4f7;border-radius:10px;padding:2px 8px;align-self:flex-start;font-weight:700;}

  .pacs{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  @media(max-width:820px){.pacs{grid-template-columns:1fr;}}
  .pcard{background:var(--navy);color:#fff;border-radius:15px;padding:20px;display:flex;align-items:center;justify-content:space-between;gap:14px;text-align:left;border:0;}
  .pcard:hover{background:var(--navy2);}
  .pcard .pn{font-weight:700;font-size:16px;}
  .pcard .pd{font-size:12.5px;color:#AEB9C6;margin-top:3px;}
  .pcard .pb{background:rgba(255,255,255,.12);color:#fff;font-size:12px;font-weight:600;padding:7px 13px;border-radius:999px;white-space:nowrap;}

  .wrap2{display:flex;gap:22px;align-items:flex-start;}
  .col-main{flex:1;min-width:0;}
  .col-side{width:320px;flex-shrink:0;display:flex;flex-direction:column;gap:16px;}
  @media(max-width:1050px){.wrap2{flex-direction:column;}.col-side{width:100%;}}

  .panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px 18px;}
  .panel h3{margin:0 0 12px;font-size:14.5px;display:flex;align-items:center;gap:8px;}
  .nrow{display:flex;gap:10px;padding:10px 0;border-top:1px solid #F1F5F9;}
  .nrow:first-of-type{border-top:0;}
  .nrow .cd{width:8px;height:8px;border-radius:4px;margin-top:5px;flex-shrink:0;background:var(--teal);}
  .nrow .nt{font-size:13px;line-height:1.35;}
  .nrow .nm2{font-size:11.5px;color:var(--muted2);margin-top:2px;}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:4px 0 18px;}
  @media(max-width:820px){.stats{grid-template-columns:repeat(2,1fr);}}
  .stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px;}
  .stat .n{font-size:24px;font-weight:800;}
  .stat .l{font-size:12px;color:var(--muted);}
  .stat.t2 .n{color:var(--teal);} .stat.t3 .n{color:var(--purple);} .stat.t4 .n{color:var(--warn);}

  .btn{border:0;border-radius:9px;background:var(--teal);color:#fff;font-weight:600;font-size:14px;padding:9px 16px;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{background:var(--tealD);}
  .btn-o{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:9px;font-size:13.5px;padding:8px 14px;}
  .btn-o:hover{background:#f6f8fa;}
  .btn-sm{padding:6px 11px;font-size:13px;border-radius:8px;}
  .btn-smg{background:#d08b1f;} .btn-smg:hover{background:#b4701a;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  .tbl{border:1px solid var(--line);background:#fff;border-radius:13px;overflow:hidden;}
  th{text-align:left;background:#f5f7f9;color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.3px;padding:11px 12px;border-bottom:1px solid var(--line);}
  td{padding:11px 12px;border-bottom:1px solid #f1f4f8;}
  tr:last-child td{border-bottom:none;}
  .bdg{font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px;display:inline-block;}
  .bdg.ok{background:#e6f4ec;color:var(--ok);} .bdg.warn{background:#fbf0d9;color:#9a6512;}
  .bdg.err{background:#fbe6e4;color:#a3362f;} .bdg.n{background:#eef2f6;color:var(--muted);}
  .bdg.m{background:#e7edf6;color:#2c5988;} .bdg.a{background:#efe7f6;color:#5a3d82;}
  .av2{width:30px;height:30px;border-radius:50%;background:#dce6ee;color:#3a4a5a;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}

  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:#2a3744;}
  .field input,.field select,.field textarea{width:100%;border:1px solid #d7dee7;border-radius:9px;padding:10px 12px;background:#fbfcfe;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(24,143,163,.15);}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:700px){.frow{grid-template-columns:1fr;}}
  .checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .checks label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;background:#f6f8fa;border:1px solid var(--line);border-radius:9px;padding:9px 11px;cursor:pointer;}
  .checks input{width:auto;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);
    color:#fff;padding:12px 20px;border-radius:11px;font-size:14px;box-shadow:0 8px 28px rgba(0,0,0,.25);
    opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .modal-bg{position:fixed;inset:0;background:rgba(10,18,28,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-bg.show{display:flex;}
  .modal{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:24px;}
  .modal h3{margin:0 0 4px;font-size:18px;}
  .modal .mx{float:right;background:none;border:0;font-size:22px;color:var(--muted);line-height:1;}

  .emptybox{background:#fff;border:1px dashed #cdd6df;border-radius:13px;padding:30px;text-align:center;color:var(--muted);}

  @media(max-width:820px){
    aside{position:fixed;left:-240px;top:62px;bottom:0;transition:.2s;z-index:35;}
    aside.open{left:0;}
    .emp-chip{display:none;} main{padding:18px 16px;}
    .pswitch button{padding:6px 8px;}
  }
  .burger{display:none;background:none;border:0;color:#fff;font-size:22px;}
  @media(max-width:820px){.burger{display:block;}}
</style>
</head>
<body>

<div class="ribbon">🔎 <b>MODO DEMONSTRAÇÃO</b> — dados fictícios · alterações não são salvas · reinicia ao atualizar a página</div>

    <button class="bell" onclick="go('notificacoes')">🔔<span class="badge" id="bell-badge">3</span></button>
    <div class="upill"><span class="av" id="u-av">SM</span><div><div class="un" id="u-nm">Cristiano Barreto</div><div class="ur" id="u-rl">Master</div></div></div>
  </div>
</header>

<div class="body">
  <aside>
    <nav id="nav"></nav>
    <div class="side-bot"><div class="v">Cockpit · v2.1.0 · by SMG Hub</div></div>
  </aside>
  <main id="main"></main>
</div>

<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalbg"><div class="modal" id="modal"></div></div>

    {nome:'Ana Ribeiro',email:'ana@impactoseg.com',perfil:'ADM',unidade:'Comercial',status:'Ativo'},
    {nome:'Carlos Menezes',email:'carlos@impactoseg.com',perfil:'Operador',unidade:'Comercial',status:'Ativo'},
    {nome:'Beatriz Lima',email:'bia@impactoseg.com',perfil:'Operador',unidade:'Financeiro',status:'Ativo'}
  ],
  convites:[

  {grp:'PRINCIPAL',itens:[
    {id:'inicio',ic:'🏠',nome:'Início'},
    {id:'tarefas',ic:'✅',nome:'Tarefas'},
    {id:'notificacoes',ic:'🔔',nome:'Notificações'},

  ]},

/* ============================= HELPERS ============================= */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
let toastTimer;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);}
function modal(html){$('#modal').innerHTML=html;$('#modalbg').classList.add('show');}
function fecharModal(){$('#modalbg').classList.remove('show');}
$('#modalbg').addEventListener('click',e=>{if(e.target.id==='modalbg')fecharModal();});
function pode(sec){return PERFIS[DB.perfil].pode.includes(sec);}
function go(sec){if(!pode(sec)){toast('Seu perfil não tem acesso a esta área.');return;}DB.secao=sec;render();}
function statusDemo(d){const dias=Math.ceil((d.validade-HOJE)/86400000);if(d.status==='Inativa')return{t:'Inativa',c:'n',dias};if(dias<0)return{t:'Expirada',c:'err',dias};if(dias<=3)return{t:'Expira em '+dias+'d',c:'warn',dias};return{t:'Ativa',c:'ok',dias};}

/* ============================= RENDER ============================= */
function trocarPerfil(p){DB.perfil=p;if(!pode(DB.secao))DB.secao='inicio';render();toast('Agora você está vendo como: '+p);}

function renderHeader(){
  const P=PERFIS[DB.perfil];
  $('#pswitch').innerHTML=Object.keys(PERFIS).map(p=>`<button class="${p===DB.perfil?'on':''}" onclick="trocarPerfil('${p}')">${p}</button>`).join('');
  $('#u-av').textContent=P.av;$('#u-nm').textContent=P.nome;$('#u-rl').textContent=DB.perfil;
  $('#emp-nm').textContent=DB.empresa.nome;$('#emp-lg').textContent=DB.empresa.inicial;
  $('#bell-badge').textContent=DB.notifs.filter(n=>!n.lido).length||'';
  $('#bell-badge').style.display=DB.notifs.some(n=>!n.lido)?'flex':'none';
}
function renderNav(){
  const box=$('#nav');box.innerHTML='';
  NAV.forEach(g=>{
    const vis=g.itens.filter(i=>pode(i.id));
    if(!vis.length)return;
    box.appendChild(el('div','grp-h',g.grp));
    vis.forEach(i=>{
      let cnt='';
      if(i.id==='notificacoes'){const c=DB.notifs.filter(n=>!n.lido).length;if(c)cnt=`<span class="cnt">${c}</span>`;}
      if(i.id==='demos'){cnt=`<span class="cnt">${DB.demos.filter(d=>statusDemo(d).t!=='Expirada'&&d.status!=='Inativa').length}</span>`;}
      const b=el('button',`navi ${i.smg?'smg':''} ${DB.secao===i.id?'on':''}`,`<span class="ic">${i.ic}</span>${i.nome}${cnt}`);
      b.onclick=()=>go(i.id);box.appendChild(b);
    });
  });
}

function abrirTool(i){toast('Abriria "'+DB.tools[i].n+'" numa nova aba (demo).');}

V.tarefas=()=>{
  const gestao=DB.perfil!=='Operador';
  const lista=gestao?DB.tarefas:DB.tarefas.filter(t=>t.respU===DB.perfil);
  let h=`<div class="pagehead"><div><h1 class="wel">Tarefas</h1><p class="sub">${gestao?'Todas as atividades da equipe.':'Suas atividades.'}</p></div>`;
  if(gestao)h+=`<button class="btn" onclick="novaTarefa()">+ Nova tarefa</button>`;
  h+=`</div>`;
  if(gestao){
    const c=s=>DB.tarefas.filter(t=>t.status===s).length;
    h+=`<div class="stats"><div class="stat"><div class="n">${c('Pendente')}</div><div class="l">Pendentes</div></div>
    <div class="stat t2"><div class="n">${c('Em andamento')}</div><div class="l">Em andamento</div></div>
    <div class="stat t4"><div class="n">${c('Concluída')}</div><div class="l">Aguardando aprovação</div></div>
    <div class="stat t3"><div class="n">${DB.tarefas.length}</div><div class="l">Total</div></div></div>`;
  }
  h+=`<div class="tbl"><table><tr><th>Tarefa</th><th>Responsável</th><th>Prazo</th><th>Status</th><th></th></tr>`;
  lista.forEach(t=>{
    const bc=t.status==='Concluída'?'warn':t.status==='Em andamento'?'m':t.status==='Aprovada'?'ok':'n';
    let acao='';
    if(t.status==='Pendente'&&(t.respU===DB.perfil||gestao))acao=`<button class="btn-o btn-sm" onclick="acaoTarefa('${t.id}','Em andamento')">Iniciar</button>`;
    else if(t.status==='Em andamento'&&(t.respU===DB.perfil||gestao))acao=`<button class="btn-o btn-sm" onclick="acaoTarefa('${t.id}','Concluída')">Concluir</button>`;
    else if(t.status==='Concluída'&&DB.perfil==='Master')acao=`<button class="btn btn-sm" onclick="acaoTarefa('${t.id}','Aprovada')">Aprovar</button>`;
    h+=`<tr><td style="font-weight:600">${t.titulo}</td><td>${t.resp}</td><td>${t.prazo}</td><td><span class="bdg ${bc}">${t.status}</span></td><td style="text-align:right">${acao}</td></tr>`;
  });
  h+=`</table></div>`;
  if(!lista.length)h=h.replace(/<div class="tbl">[\s\S]*<\/div>/,'<div class="emptybox">Nenhuma tarefa atribuída a você.</div>');
  return h;
};
function acaoTarefa(id,novo){const t=DB.tarefas.find(x=>x.id===id);t.status=novo;toast('Tarefa "'+t.titulo+'" → '+novo+' (demo).');render();}
function novaTarefa(){modal(`<button class="mx" onclick="fecharModal()">×</button><h3>Nova tarefa</h3><p class="muted" style="margin-top:0">O responsável recebe aviso por e-mail e no sino.</p>
  <div class="field"><label>Título</label><input id="nt-tit" placeholder="Ex: Revisar contrato"></div>
  <div class="frow"><div class="field"><label>Responsável</label><select id="nt-resp">${DB.usuarios.map(u=>`<option>${u.nome}</option>`).join('')}</select></div>
  <div class="field"><label>Prazo</label><input id="nt-prazo" type="date"></div></div>
  <div class="field"><label>Descrição</label><textarea rows="2"></textarea></div>
  <button class="btn" onclick="salvarTarefa()">Criar tarefa</button>`);}
function salvarTarefa(){const tit=$('#nt-tit').value||'Nova tarefa';const resp=$('#nt-resp').value;const u=DB.usuarios.find(x=>x.nome===resp);
  DB.tarefas.unshift({id:'t'+Date.now(),titulo:tit,resp:resp,respU:u.perfil,prazo:$('#nt-prazo').value?fmt(new Date($('#nt-prazo').value)):'—',status:'Pendente'});
  fecharModal();toast('Tarefa criada e atribuída a '+resp+' (demo).');render();}

V.demos=()=>{
  const ativas=DB.demos.filter(d=>statusDemo(d).t!=='Expirada'&&d.status!=='Inativa').length;
  const expira=DB.demos.filter(d=>statusDemo(d).c==='warn').length;
  const expiradas=DB.demos.filter(d=>statusDemo(d).t==='Expirada').length;
  let h=`<div class="pagehead"><div><h1 class="wel">Demos (SMG) 🧪</h1><p class="sub">Seu painel interno: gere, acompanhe e renove as demonstrações dos clientes.</p></div><button class="btn btn-smg" onclick="novaDemo()">+ Gerar nova demo</button></div>`;
  h+=`<div class="stats"><div class="stat t2"><div class="n">${ativas}</div><div class="l">Demos ativas</div></div>
  <div class="stat t4"><div class="n">${expira}</div><div class="l">Expiram em ≤3 dias</div></div>
  <div class="stat"><div class="n">${expiradas}</div><div class="l">Expiradas</div></div>
  <div class="stat t3"><div class="n">${DB.demos.length}</div><div class="l">Total geradas</div></div></div>`;
  h+=`<div class="tbl"><table><tr><th>Empresa</th><th>Contato</th><th>Segmento</th><th>Início</th><th>Validade</th><th>Status</th><th></th></tr>`;
  DB.demos.forEach(d=>{const s=statusDemo(d);
    h+=`<tr><td><b>${d.empresa}</b><div class="nm2" style="color:var(--muted2)">${d.apelido}</div></td>
    <td>${d.contato}<div class="nm2" style="color:var(--muted2)">${d.email}</div></td>
    <td>${d.segmento}</td><td>${fmt(d.inicio)}</td><td>${fmt(d.validade)}</td>
    <td><span class="bdg ${s.c}">${s.t}</span></td>
    <td style="text-align:right;white-space:nowrap">
      <button class="btn-o btn-sm" onclick="toast('Abriria a demo da ${d.empresa} em nova aba (demo).')">Abrir</button>
      <button class="btn-o btn-sm" onclick="prorrogar('${d.id}')">+7 dias</button>
      <button class="btn-o btn-sm" onclick="editarDemo('${d.id}')">Editar</button>
    </td></tr>`;});
  h+=`</table></div>`;
  h+=`<p class="muted" style="margin-top:12px">Para prorrogar ou trocar dados/imagens de uma demo, use <b>Editar</b> — a demo do cliente se atualiza sem refazer nada.</p>`;
  return h;
};

  </div></div>
  <div class="frow"><div class="field"><label>Início</label><input id="dm-ini" type="date" value="2026-10-21"></div>
  <div class="field"><label>Validade</label><input id="dm-val" type="date" value="2026-11-04"></div></div>
  <div class="field"><label>Padrão de marca</label><select><option>Co-marca (Cockpit SMG · Empresa)</option><option>White-label (só a marca do cliente)</option></select></div>
  <button class="btn btn-smg" onclick="salvarDemo()">Gerar demo e link</button>`);}
function salvarDemo(){const emp=$('#dm-emp').value||'Nova Empresa';const ape=$('#dm-ape').value||emp;
  const ini=$('#dm-ini').value?new Date($('#dm-ini').value):HOJE;const val=$('#dm-val').value?new Date($('#dm-val').value):addDias(HOJE,14);
  DB.demos.unshift({id:'d'+Date.now(),empresa:emp,apelido:ape,contato:$('#dm-ct').value||'—',email:$('#dm-em').value||'—',segmento:$('#dm-seg').value||'—',inicio:ini,validade:val,status:'Ativa'});
  fecharModal();toast('Demo da '+emp+' gerada! Link: cockpit.smg/demo/'+ape.toLowerCase().replace(/\s+/g,'-')+' (demo).');render();}
function prorrogar(id){const d=DB.demos.find(x=>x.id===id);d.validade=addDias(d.validade,7);if(d.status==='Inativa')d.status='Ativa';toast('Validade da '+d.empresa+' prorrogada +7 dias → '+fmt(d.validade));render();}
function editarDemo(id){const d=DB.demos.find(x=>x.id===id);modal(`<button class="mx" onclick="fecharModal()">×</button><h3>Editar demo — ${d.empresa}</h3><p class="muted" style="margin-top:0">Troque dados, imagens e validade. A demo do cliente atualiza na hora.</p>
  <div class="field"><label>Empresa</label><input id="ed-emp" value="${d.empresa}"></div>
  <div class="frow"><div class="field"><label>Apelido</label><input id="ed-ape" value="${d.apelido}"></div>
  <div class="field"><label>Validade</label><input id="ed-val" type="date" value="${d.validade.toISOString().slice(0,10)}"></div></div>
  <div class="field"><label>Logo / imagem da marca</label><input type="file" accept="image/*"></div>
  <div class="field"><label>Status</label><select id="ed-st"><option ${d.status==='Ativa'?'selected':''}>Ativa</option><option ${d.status==='Inativa'?'selected':''}>Inativa</option></select></div>
  <button class="btn btn-smg" onclick="salvarEdicaoDemo('${id}')">Salvar alterações</button>`);}
function salvarEdicaoDemo(id){const d=DB.demos.find(x=>x.id===id);d.empresa=$('#ed-emp').value;d.apelido=$('#ed-ape').value;d.validade=new Date($('#ed-val').value);d.status=$('#ed-st').value;fecharModal();toast('Demo da '+d.empresa+' atualizada (demo).');render();}

/* ============================= BOOT ============================= */
function render(){renderHeader();renderNav();$('#main').innerHTML=(V[DB.secao]||V.inicio)();document.querySelector('aside').classList.remove('open');}
render();
</script>
</body>
